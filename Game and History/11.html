<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Міні-гра: Яблука</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .game-shell {
      width: min(980px, 100%);
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .hud {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .counter {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .hint {
      width: 100%;
      margin: 0;
      color: #374151;
      font-size: 14px;
    }

    .arena {
      position: relative;
      height: min(62vh, 520px);
      min-height: 280px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
      touch-action: manipulation;
    }

    .apple-btn {
      position: absolute;
      width: 72px;
      height: 72px;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .apple-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .done {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      padding: 20px;
    }

    .done.show {
      display: flex;
    }

    @media (max-width: 900px) and (orientation: landscape) {
      body {
        padding: 8px;
      }

      .game-shell {
        grid-template-columns: 280px 1fr;
        align-items: stretch;
      }

      .hud {
        align-content: start;
      }

      .arena {
        height: calc(100vh - 32px);
        min-height: 220px;
      }
    }

    @media (max-width: 560px) {
      .apple-btn {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <section class="hud">
      <p class="title">Збери яблука</p>
      <p id="counter" class="counter">0 / 20</p>
      <p class="hint">Натисни на яблуко 20 разів. Після цього буде перехід далі.</p>
    </section>

    <section id="arena" class="arena">
      <button id="apple" class="apple-btn" aria-label="Яблуко">
        <img src="../assets/apple.png" alt="Apple">
      </button>
      <div id="done" class="done">Готово! Переходимо далі...</div>
    </section>
  </div>

  <script>
    localStorage.setItem("lastScene", "Game and History/11.html");

    const goal = 20;
    let count = 0;

    const counterEl = document.getElementById("counter");
    const arenaEl = document.getElementById("arena");
    const appleEl = document.getElementById("apple");
    const doneEl = document.getElementById("done");

    function moveApple() {
      const arenaRect = arenaEl.getBoundingClientRect();
      const appleRect = appleEl.getBoundingClientRect();

      const maxX = Math.max(0, arenaRect.width - appleRect.width);
      const maxY = Math.max(0, arenaRect.height - appleRect.height);

      const x = Math.floor(Math.random() * (maxX + 1));
      const y = Math.floor(Math.random() * (maxY + 1));

      appleEl.style.left = x + "px";
      appleEl.style.top = y + "px";
    }

    function finishGame() {
      appleEl.disabled = true;
      doneEl.classList.add("show");
      setTimeout(function() {
        window.location.href = "12.html";
      }, 900);
    }

    appleEl.addEventListener("click", function() {
      count += 1;
      counterEl.textContent = count + " / " + goal;

      if (count >= goal) {
        finishGame();
        return;
      }

      moveApple();
    });

    window.addEventListener("resize", moveApple);
    window.addEventListener("orientationchange", moveApple);
    moveApple();
  </script>
</body>
</html>
